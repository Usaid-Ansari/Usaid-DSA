<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <h5>Registration Form</h5>
    <form action="/action.php">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" placeholder="Enter Name"> 
    <br>
    <br>
   <label for="password">Password:</label>
    <input type="password" id="password" name="password" placeholder="password">
     <br> <br>
     <h5>Select Your Class</h5>
     <label for="101">
    <input type="radio" value="class XI" name="class" id="101">classXI
    </label>
    <br><br>
    <label for="102">
    
    <input type="radio" value="class XII" name="class" id="102">classXII
    </label>
    <br><br>
    <h5>Select you Subject</h5>
    <label for="math"></label>
    <input type="checkbox" value="math" name="subject" id="103"> Maths
    <br><br>
     <label for="physics"></label>
    <input type="checkbox" value="physics" name="subject" id="104"> Physics
    <br><br>
     <label for="chemistry"></label>
    <input type="checkbox" value="chemistry" name="subject" id="105"> Chemistry
    <br><br>
     <label for="biology"></label>
    <input type="checkbox" value="biology" name="subject" id="106"> Biology
    <br> <br>
    <label for="city">Select Your City :</label>
    <select name="city" id="city">
        <option value="Dhule">Dhule</option>
        <option value="Pune">Pune</option>
        <option value="Mumbai">Mumbai</option>
        <option value="Nashik">Nashik</option>
    </select>
    <br><br>

    <textarea name="feedback" id="107" placeholder="please give your feedback" rows="5"></textarea>
    <br> <br>
    <input type="submit" value="submit">
    </form>
</body>
</html>
